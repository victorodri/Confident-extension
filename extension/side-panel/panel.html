<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confident Side Panel</title>
  <link rel="stylesheet" href="panel-v2.css" />
</head>
<body>
  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- HEADER (dinámico, se genera con JavaScript) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div id="app-header"></div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- MAIN CONTENT (dinámico, se genera según el estado) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <main id="app-main" class="main"></main>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- ACTIONS (checkbox + botón en estados 3-4) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div id="app-actions"></div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- FOOTER (dinámico, se genera con JavaScript) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div id="app-footer"></div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- SCRIPTS -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <script src="../logger.js"></script>
  <script src="../config.js"></script>
  <script src="../device-fingerprint.js"></script>
  <script type="module" src="components.js"></script>
  <script type="module" src="panel-v2.js"></script>
</body>
</html>
